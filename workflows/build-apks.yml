name: ULAK BYD APK Otomatik Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ulak-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak Kodları Çek
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: Gradle Kurulumu ve APK Derlemesi (DiLink 3.0 & S26 Ultra)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          arguments: assembleDebug

      - name: UlakCar (DiLink 3.0) APK Yükle
        uses: actions/upload-artifact@v4
        with:
          name: UlakCar_DiLink3_APK
          path: app-car/build/outputs/apk/debug/*.apk

      - name: UlakMobile (Samsung S26 Ultra) APK Yükle
        uses: actions/upload-artifact@v4
        with:
          name: UlakMobile_S26Ultra_APK
          path: app-mobile/build/outputs/apk/debug/*.apk
